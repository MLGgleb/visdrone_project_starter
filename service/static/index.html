<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisDrone · YOLO11s</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#e7eaf3;background:#10151f}body{max-width:980px;margin:36px auto;padding:0 20px}h1{font-size:2rem}p,.muted{color:#a6b1c4}.panel{background:#1b2432;border:1px solid #354052;border-radius:14px;padding:22px;margin:18px 0}input,button{font:inherit}input[type=file]{width:100%;padding:12px 0}input[type=range]{width:230px}button{background:#5b91fa;border:0;color:#081525;border-radius:8px;padding:11px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}img,video{width:100%;max-height:570px;object-fit:contain;border-radius:8px;background:#080d13}a{color:#91b9ff}li{margin:7px 0}#status{white-space:pre-wrap}</style></head><body>
<h1>VisDrone · YOLO11s</h1><p>Обнаружение пешеходов и транспорта на аэроснимках. Загрузите изображение или видео для обработки локальной моделью.</p>
<div class="panel"><form id="form"><label for="file">Изображение или видео</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/x-msvideo,video/quicktime,video/x-matroska" required><p><label for="conf">Порог уверенности: <b id="confval">0.25</b></label><br><input id="conf" type="range" min="0.05" max="0.95" step="0.05" value="0.25"></p><button id="submit">Обнаружить объекты</button></form><p id="status" role="status"></p></div>
<div class="panel" id="result" hidden><h2>Результат</h2><div id="preview"></div><p id="summary"></p><a id="download" download>Открыть результат</a><details><summary>Обнаружения</summary><pre id="objects" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details></div>
<div class="panel"><h2>История обработок</h2><button id="refresh" type="button">Обновить историю</button><ul id="history"></ul></div>
<script>
const form=document.getElementById('form'),file=document.getElementById('file'),conf=document.getElementById('conf'),status=document.getElementById('status');conf.oninput=()=>document.getElementById('confval').textContent=conf.value;
async function history(){try{const res=await fetch('/api/history');if(!res.ok)throw Error('Ошибка истории');const rows=await res.json(),list=document.getElementById('history');list.replaceChildren();for(const r of rows){const li=document.createElement('li'),a=document.createElement('a');a.href=r.result_url;a.textContent=`${r.created_at} · ${r.filename} · ${r.detections} обнаружений`;li.append(a);list.append(li)}}catch(e){status.textContent=e.message}}
document.getElementById('refresh').onclick=history;
form.onsubmit=async e=>{e.preventDefault();const f=file.files[0];if(!f)return;const isVideo=f.type.startsWith('video/')||/\.(mp4|avi|mov|mkv)$/i.test(f.name);const fd=new FormData();fd.append('file',f);fd.append('confidence',conf.value);const btn=document.getElementById('submit');btn.disabled=true;status.textContent='Обработка… видео может занять несколько минут.';try{const res=await fetch(isVideo?'/api/detect/video':'/api/detect/image',{method:'POST',body:fd});const data=await res.json();if(!res.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));const preview=document.getElementById('preview');preview.replaceChildren();const media=document.createElement(isVideo?'video':'img');media.src=data.result_url;if(isVideo){media.controls=true;media.preload='metadata'}else media.alt='Изображение с обнаруженными объектами';preview.append(media);document.getElementById('summary').textContent=isVideo?`Обработано кадров: ${data.frames}. Суммарно обнаружений по кадрам: ${data.total_detections_across_frames}. Время: ${data.elapsed_seconds} с.`:`Обнаружено объектов: ${data.count}. Время: ${data.elapsed_seconds} с.`;document.getElementById('objects').textContent=JSON.stringify(data.detections||[],null,2);document.getElementById('download').href=data.result_url;document.getElementById('result').hidden=false;status.textContent='Готово';await history()}catch(err){status.textContent='Ошибка: '+err.message}finally{btn.disabled=false}};history();
</script></body></html>
